<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guandan AI Replay Viewer</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    button { margin-right: 0.5rem; padding: 0.4rem 0.8rem; }
    .panel { border: 1px solid #888; border-radius: 8px; margin-top: 1rem; padding: 1rem; }
    .cards { font-family: ui-monospace, monospace; font-weight: 700; }
    .muted { opacity: 0.72; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #8888; padding: 0.4rem; text-align: left; }
  </style>
</head>
<body>
  <h1>Guandan AI Replay Viewer</h1>
  <p class="muted">Open a public JSON trace generated by <code>tools/play_demo.py --trace demo.json</code>.</p>
  <input id="file" type="file" accept=".json,application/json">
  <div class="panel">
    <button id="prev" type="button">Previous</button>
    <button id="next" type="button">Next</button>
    <span id="position">No replay loaded</span>
  </div>
  <div id="content" class="panel">Choose a trace file to begin.</div>
  <script>
    let replay = null;
    let index = 0;

    const esc = (value) => String(value).replace(/[&<>"']/g, (char) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);
    const list = (values) => values.length ? values.map(esc).join(", ") : "none";
    const action = (value) => value
      ? `<strong>${esc(value.type)}</strong> <span class="cards">${list(value.cards)}</span>`
      : "none";
    const stateRows = (state) => state.hand_sizes.map((size, player) =>
      `<tr><td>P${player}</td><td>${size}</td><td>${state.finished.includes(player) ? "finished" : ""}</td></tr>`
    ).join("");

    function render() {
      if (!replay) return;
      const turns = replay.turns || [];
      const turn = turns[index];
      document.getElementById("position").textContent = `Turn ${index + 1} of ${turns.length}`;
      document.getElementById("prev").disabled = index === 0;
      document.getElementById("next").disabled = index >= turns.length - 1;
      document.getElementById("content").innerHTML = `
        <p><strong>Seed:</strong> ${esc(replay.seed)} | <strong>Level rank:</strong> ${esc(replay.rule_config.level_rank)}</p>
        <p><strong>P${esc(turn.player)} played:</strong> ${action(turn.action)}</p>
        <p><strong>Current trick before play:</strong> ${action(turn.before.last_action)}
          ${turn.before.last_actor === null ? "" : `(by P${esc(turn.before.last_actor)})`}</p>
        <p><strong>Finish order so far:</strong> ${list(turn.after.finished)}</p>
        <table><thead><tr><th>Player</th><th>Cards after play</th><th>Status</th></tr></thead>
        <tbody>${stateRows(turn.after)}</tbody></table>
      `;
    }

    document.getElementById("file").addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      replay = JSON.parse(await file.text());
      if (replay.schema_version !== 1 || !Array.isArray(replay.turns) || replay.turns.length === 0) {
        throw new Error("Unsupported or empty replay trace.");
      }
      index = 0;
      render();
    });
    document.getElementById("prev").addEventListener("click", () => { index--; render(); });
    document.getElementById("next").addEventListener("click", () => { index++; render(); });
  </script>
</body>
</html>
